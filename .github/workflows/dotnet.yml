name: .NET WPF Build

on:
  push:
    branches: [ "primary" ]
  pull_request:
    branches: [ "primary" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    
    - name: Build
      run: dotnet build src/ReciteHelper.slnx --configuration Release

    - name: Test native C# OAuth
      run: dotnet test tests/ReciteHelper.OAuth.Tests/ReciteHelper.OAuth.Tests.csproj --configuration Release --no-build

    - name: Publish Application
      run: |
        $projectFile = Join-Path $PWD 'ReciteHelper.Wpf/ReciteHelper.Wpf.csproj'
        if (Test-Path -LiteralPath $projectFile) {
          dotnet publish $projectFile `
            --configuration Release `
            --output ./publish `
            --self-contained true `
            --runtime win-x64 `
            /p:PublishSingleFile=true
        } else {
          Write-Error "Could not find project file (.csproj)"
          exit 1
        }
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ReciteHelper-App
        path: ./publish/
